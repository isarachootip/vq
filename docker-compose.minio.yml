version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: vservice-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vservice_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-VService@Minio2026!}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-https://minio.vibepjm.online}
      MINIO_SERVER_URL: ${MINIO_API_URL:-https://storage.vibepjm.online}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # MinIO Web Console
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: vservice-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vservice_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local
